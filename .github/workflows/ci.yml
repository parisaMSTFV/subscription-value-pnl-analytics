name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: pytest -q
      - name: Validate external-input contract
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: make fixture
      - name: Reproduce aggregate decision evidence
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          make verify-evidence
          git diff --exit-code -- reports/*.csv reports/*.json reports/*.md
      - name: Check sensitive content
        run: python scripts/check_sensitive.py
